<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun Yemima ke-12!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        
        header {
            margin: 20px 0;
            position: relative;
        }
        
        h1 {
            color: #ff4081;
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }
        
        .age-display {
            font-size: 6rem;
            color: #ff4081;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 3px 3px 0 #ffd54f;
            animation: pulse 1.5s infinite;
        }
        
        .birthday-cake {
            width: 300px;
            height: 250px;
            margin: 20px auto;
            position: relative;
        }
        
        .cake {
            width: 200px;
            height: 100px;
            background: #ffd54f;
            border-radius: 10px 10px 0 0;
            position: absolute;
            bottom: 0;
            left: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .cake-top {
            width: 220px;
            height: 30px;
            background: #ff8a65;
            border-radius: 10px;
            position: absolute;
            bottom: 100px;
            left: 40px;
        }
        
        .candle {
            width: 10px;
            height: 40px;
            background: #4fc3f7;
            position: absolute;
            bottom: 130px;
            left: 145px;
            border-radius: 5px 5px 0 0;
        }
        
        .flame {
            width: 15px;
            height: 25px;
            background: #ffeb3b;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            bottom: 170px;
            left: 142.5px;
            animation: flicker 0.5s infinite alternate;
            box-shadow: 0 0 10px #ff9800;
        }
        
        .balloons {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }
        
        .balloon {
            width: 60px;
            height: 70px;
            border-radius: 50%;
            margin: 0 10px;
            position: relative;
            animation: float 5s infinite ease-in-out;
        }
        
        .balloon::after {
            content: '';
            width: 2px;
            height: 70px;
            background: #fff;
            position: absolute;
            bottom: -70px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .balloon:nth-child(1) {
            background: #e91e63;
            animation-delay: 0s;
        }
        
        .balloon:nth-child(2) {
            background: #9c27b0;
            animation-delay: 0.5s;
        }
        
        .balloon:nth-child(3) {
            background: #3f51b5;
            animation-delay: 1s;
        }
        
        .balloon:nth-child(4) {
            background: #03a9f4;
            animation-delay: 1.5s;
        }
        
        .balloon:nth-child(5) {
            background: #009688;
            animation-delay: 2s;
        }
        
        .message {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-size: 1.2rem;
            line-height: 1.6;
        }
        
        .gift-box {
            width: 100px;
            height: 100px;
            background: #e91e63;
            margin: 30px auto;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }
        
        .gift-box:hover {
            transform: rotateY(15deg) rotateX(15deg);
        }
        
        .gift-lid {
            width: 110px;
            height: 20px;
            background: #c2185b;
            position: absolute;
            top: -20px;
            left: -5px;
        }
        
        .gift-bow {
            width: 20px;
            height: 20px;
            background: #ffeb3b;
            border-radius: 50%;
            position: absolute;
            top: -30px;
            left: 45px;
        }
        
        .gift-bow::before, .gift-bow::after {
            content: '';
            width: 60px;
            height: 10px;
            background: #ffeb3b;
            position: absolute;
            top: 5px;
        }
        
        .gift-bow::before {
            left: -70px;
            transform: rotate(45deg);
        }
        
        .gift-bow::after {
            left: 30px;
            transform: rotate(-45deg);
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            opacity: 0;
        }
        
        button {
            background: #ff4081;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        
        button:hover {
            background: #f50057;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        
        .photo-frame {
            width: 200px;
            height: 200px;
            border: 10px solid #ffd54f;
            border-radius: 10px;
            margin: 20px auto;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: #ff4081;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes flicker {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.1); opacity: 0.8; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        
        /* Responsive design */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .age-display { font-size: 4rem; }
            .birthday-cake { transform: scale(0.8); }
            .balloon { width: 40px; height: 50px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Selamat Ulang Tahun!</h1>
            <div class="age-display" id="ageDisplay">12</div>
        </header>
        
        <div class="birthday-cake">
            <div class="cake"></div>
            <div class="cake-top"></div>
            <div class="candle"></div>
            <div class="flame" id="candleFlame"></div>
        </div>
        
        <div class="balloons">
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
        </div>
        
        <div class="message">
            <p>Halo <strong>Yemima</strong>! Selamat ulang tahun yang ke-12!</p>
            <p>Semoga di usia yang baru ini, kamu semakin sehat, ceria, dan sukses dalam segala hal.</p>
            <p>Teruslah bermimpi dan jadilah versi terbaik dari dirimu!</p>
        </div>
        
        <div class="photo-frame">
            <span>🎂</span>
        </div>
        
        <div class="gift-box" id="giftBox">
            <div class="gift-lid"></div>
            <div class="gift-bow"></div>
        </div>
        
        <div>
            <button id="musicBtn">Putar Musik</button>
            <button id="confettiBtn">Lepaskan Konfeti!</button>
            <button id="wishBtn">Buat Permohonan</button>
        </div>
    </div>

    <audio id="birthdayMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-happy-birthday-to-you-happy-birthday-443.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Elemen DOM
        const ageDisplay = document.getElementById('ageDisplay');
        const candleFlame = document.getElementById('candleFlame');
        const giftBox = document.getElementById('giftBox');
        const musicBtn = document.getElementById('musicBtn');
        const confettiBtn = document.getElementById('confettiBtn');
        const wishBtn = document.getElementById('wishBtn');
        const birthdayMusic = document.getElementById('birthdayMusic');
        
        // Variabel status
        let isMusicPlaying = false;
        let candlesBlown = false;
        
        // Animasi angka usia
        function animateAge() {
            let age = 0;
            const targetAge = 12;
            const interval = setInterval(() => {
                ageDisplay.textContent = age;
                age++;
                if (age > targetAge) {
                    clearInterval(interval);
                }
            }, 100);
        }
        
        // Fungsi untuk membuat konfeti
        function createConfetti() {
            const colors = ['#e91e63', '#9c27b0', '#3f51b5', '#03a9f4', '#009688', '#ffeb3b', '#ff9800'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animation = `confetti-fall ${Math.random() * 3 + 2}s linear forwards`;
                confetti.style.animationDelay = Math.random() * 2 + 's';
                
                document.body.appendChild(confetti);
                
                // Hapus konfeti setelah animasi selesai
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }
        
        // Fungsi untuk meniup lilin
        function blowCandles() {
            if (!candlesBlown) {
                candleFlame.style.animation = 'none';
                candleFlame.style.opacity = '0';
                candlesBlown = true;
                
                // Tampilkan pesan setelah lilin ditiup
                setTimeout(() => {
                    alert('Yeay! Lilin sudah ditiup! Sekarang saatnya membuat permohonan!');
                }, 500);
            }
        }
        
        // Fungsi untuk membuka kado
        function openGift() {
            giftBox.style.transform = 'scale(1.5) rotate(360deg)';
            giftBox.style.opacity = '0.5';
            
            setTimeout(() => {
                alert('Kado telah dibuka! Hadiah untuk Yemima adalah... cinta dan kebahagiaan yang tak terbatas! 🎁');
                giftBox.style.transform = 'scale(1) rotate(0deg)';
                giftBox.style.opacity = '1';
            }, 1000);
        }
        
        // Event Listeners
        window.addEventListener('load', () => {
            animateAge();
            setTimeout(() => {
                alert('Selamat datang di pesta ulang tahun Yemima!');
            }, 1500);
        });
        
        candleFlame.addEventListener('click', blowCandles);
        
        giftBox.addEventListener('click', openGift);
        
        musicBtn.addEventListener('click', () => {
            if (isMusicPlaying) {
                birthdayMusic.pause();
                musicBtn.textContent = 'Putar Musik';
            } else {
                birthdayMusic.play();
                musicBtn.textContent = 'Hentikan Musik';
            }
            isMusicPlaying = !isMusicPlaying;
        });
        
        confettiBtn.addEventListener('click', createConfetti);
        
        wishBtn.addEventListener('click', () => {
            if (candlesBlown) {
                const wish = prompt('Apa permohonan ulang tahunmu, Yemima?');
                if (wish) {
                    alert(`Permohonan "${wish}" telah dikirim ke alam semesta! Semoga terkabul! ✨`);
                }
            } else {
                alert('Tiuplah lilinnya terlebih dahulu sebelum membuat permohonan!');
            }
        });
        
        // Efek ketik untuk pesan ulang tahun
        const messageText = "Halo Yemima! Selamat ulang tahun yang ke-12! Semoga di usia yang baru ini, kamu semakin sehat, ceria, dan sukses dalam segala hal. Teruslah bermimpi dan jadilah versi terbaik dari dirimu!";
        let messageIndex = 0;
        const messageElement = document.querySelector('.message p');
        
        function typeMessage() {
            if (messageIndex < messageText.length) {
                messageElement.textContent += messageText.charAt(messageIndex);
                messageIndex++;
                setTimeout(typeMessage, 50);
            }
        }
        
        // Mulai efek ketik setelah halaman dimuat
        window.addEventListener('load', () => {
            setTimeout(typeMessage, 2000);
        });
    </script>
</body>
</html>
